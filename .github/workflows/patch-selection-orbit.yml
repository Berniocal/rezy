name: Apply selection mouse rotation patch

on:
  push:
    paths:
      - .github/workflows/patch-selection-orbit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          def repl(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new)

          repl(
              '<button type="button" id="mouseRotateBtn" aria-pressed="false">🔒 Otáčení myší zamčeno</button>',
              '<button type="button" id="resetViewBtn">↺ Výchozí pohled</button>',
              'rotation button'
          )

          repl(
              "const mouseRotateBtn=root.querySelector('#mouseRotateBtn');",
              "const resetViewBtn=root.querySelector('#resetViewBtn');",
              'button const'
          )

          repl(
              "      mouseRotate:false,\n      dragging:false,\n      last:null,",
              "      mouseRotate:true,\n      dragging:false,\n      dragMoved:false,\n      last:null,",
              'mouse rotation state'
          )

          repl(
              "    function setTool(tool){\n      if(tool==='none') tool=null;",
              "    function syncMouseRotationMode(){\n      const enabled=state.tool===null && !state.sectionMode && !root.classList.contains('lesson-playback');\n      state.mouseRotate=enabled;\n      svg.dataset.orbit=String(enabled);\n      if(!enabled){\n        state.dragging=false;\n        state.dragMoved=false;\n        state.last=null;\n        svg.dataset.dragging='false';\n      }\n    }\n\n    function setTool(tool){\n      if(tool==='none') tool=null;",
              'sync helper'
          )

          repl(
              "      state.tool=tool;\n      state.pending=[];",
              "      state.tool=tool;\n      syncMouseRotationMode();\n      state.pending=[];",
              'tool sync'
          )

          repl(
              "    mouseRotateBtn.addEventListener('click',()=>{\n      state.mouseRotate=!state.mouseRotate;\n      mouseRotateBtn.textContent=state.mouseRotate\n        ? '🔓 Otáčení myší odemčeno'\n        : '🔒 Otáčení myší zamčeno';\n      mouseRotateBtn.setAttribute('aria-pressed',String(state.mouseRotate));\n      mouseRotateBtn.dataset.active=String(state.mouseRotate);\n      svg.dataset.orbit=String(state.mouseRotate);\n      if(!state.mouseRotate) svg.dataset.dragging='false';\n      state.hover=null;\n      renderOverlay();\n      status.textContent=state.mouseRotate\n        ? 'Otáčení myší odemčeno: táhni po ploše. Konstrukce se pohybuje spolu s tělesem.'\n        : 'Otáčení myší zamčeno: kliknutím do plochy můžeš zase rýsovat.';\n    });",
              "    resetViewBtn.addEventListener('click',()=>{\n      stopAutoRotation();\n      cancelViewAnimation();\n      resetObjectTransform();\n      resetViewToSchool();\n      state.activeFixedView='rightTop';\n      if(fixedViewSelect) fixedViewSelect.value='rightTop';\n      render();\n      status.textContent='Výchozí pohled obnoven.';\n    });",
              'reset view handler'
          )

          repl(
              "      if(state.mouseRotate && e.button===0){\n        stopAutoRotation();\n        clearFixedViewActive();\n        state.dragging=true;\n        svg.dataset.dragging='true';\n        state.last=pt;\n        state.hover=null;\n        state.hoverDirection=null;\n        svg.setPointerCapture(e.pointerId);\n        status.textContent='Otáčím těleso myší…';\n        renderOverlay();\n        return;\n      }",
              "      if(state.mouseRotate && state.tool===null && !state.sectionMode && e.button===0){\n        state.dragging=true;\n        state.dragMoved=false;\n        svg.dataset.dragging='true';\n        state.last=pt;\n        state.hover=null;\n        state.hoverDirection=null;\n        svg.setPointerCapture(e.pointerId);\n        renderOverlay();\n      }",
              'pointerdown rotation'
          )

          repl(
              "      if(state.dragging && state.last){\n        const dx=pt.x-state.last.x;\n        const dy=pt.y-state.last.y;\n\n        // Orbit jako v GeoGebře:",
              "      if(state.dragging && state.last){\n        const dx=pt.x-state.last.x;\n        const dy=pt.y-state.last.y;\n\n        if(!state.dragMoved && Math.hypot(dx,dy)<2) return;\n        if(!state.dragMoved){\n          state.dragMoved=true;\n          stopAutoRotation();\n          clearFixedViewActive();\n          status.textContent='Otáčím těleso myší…';\n        }\n\n        // Orbit jako v GeoGebře:",
              'pointermove drag threshold'
          )

          repl(
              "    function stopMouseRotation(e){\n      if(!state.dragging) return;\n      state.dragging=false;\n      svg.dataset.dragging='false';\n      state.last=null;\n      try{ svg.releasePointerCapture(e.pointerId); }catch(_){}\n      status.textContent='Otáčení myší odemčeno. Konstrukce zůstává navázaná na těleso.';\n    }",
              "    function stopMouseRotation(e){\n      if(!state.dragging) return;\n      const moved=state.dragMoved;\n      state.dragging=false;\n      state.dragMoved=false;\n      svg.dataset.dragging='false';\n      state.last=null;\n      try{ svg.releasePointerCapture(e.pointerId); }catch(_){}\n      if(moved) status.textContent='Těleso pootočeno myší. Konstrukce zůstává navázaná na těleso.';\n      else setStatus();\n    }",
              'pointerup rotation'
          )

          repl(
              "    sectionBtn.addEventListener('click',()=>{\n      state.sectionMode=!state.sectionMode;\n      state.pending=[];\n      state.hover=null;\n      state.hoverDirection=null;\n      sectionBtn.dataset.active=String(state.sectionMode);\n      if(state.sectionMode){\n        setTool(null);\n        state.sectionMode=true;\n        sectionBtn.dataset.active='true';\n        status.textContent='Zvýraznit řez: klikni na libovolnou narýsovanou úsečku nebo přímku, která tvoří řez.';\n      }else{\n        status.textContent='Zvýraznění řezu zrušeno.';\n      }\n      render();\n    });",
              "    sectionBtn.addEventListener('click',()=>{\n      state.sectionMode=!state.sectionMode;\n      state.pending=[];\n      state.hover=null;\n      state.hoverDirection=null;\n      sectionBtn.dataset.active=String(state.sectionMode);\n      if(state.sectionMode){\n        setTool(null);\n        state.sectionMode=true;\n        sectionBtn.dataset.active='true';\n        status.textContent='Zvýraznit řez: klikni na libovolnou narýsovanou úsečku nebo přímku, která tvoří řez.';\n      }else{\n        status.textContent='Zvýraznění řezu zrušeno.';\n      }\n      syncMouseRotationMode();\n      render();\n    });",
              'section mode sync'
          )

          repl(
              "      state.sectionMode=false;\n      sectionBtn.dataset.active='false';\n      state.selectedDrawings=[];",
              "      state.sectionMode=false;\n      sectionBtn.dataset.active='false';\n      syncMouseRotationMode();\n      state.selectedDrawings=[];",
              'clear mode sync'
          )

          repl(
              "    function enterLessonPlayback(steps){ lessonState.playback=true;lessonState.playbackSteps=steps;lessonState.playbackIndex=0;lessonState.recording=false;stopAutoRotation();state.mouseRotate=false;mouseRotateBtn.dataset.active='false';mouseRotateBtn.setAttribute('aria-pressed','false');mouseRotateBtn.textContent='🔒 Otáčení myší zamčeno';root.classList.add('lesson-playback');lessonPlayer.hidden=false;showLessonStep(0); }",
              "    function enterLessonPlayback(steps){ lessonState.playback=true;lessonState.playbackSteps=steps;lessonState.playbackIndex=0;lessonState.recording=false;stopAutoRotation();state.mouseRotate=false;state.dragging=false;state.dragMoved=false;state.last=null;svg.dataset.orbit='false';svg.dataset.dragging='false';root.classList.add('lesson-playback');lessonPlayer.hidden=false;showLessonStep(0); }",
              'lesson playback'
          )

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/patch-selection-orbit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Enable mouse rotation in selection mode and add reset view"
          git push
